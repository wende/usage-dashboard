<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<style>
  :root { --daimon-widget-host-safe-inline-end: 190px; --daimon-widget-host-safe-block-start: 44px; }
  .kimi-host-safe-context { container-type: inline-size; }
  .kimi-host-safe-header { box-sizing: border-box; min-block-size: var(--daimon-widget-host-safe-block-start, 44px); padding-inline-end: var(--daimon-widget-host-safe-inline-end, 190px); }
  @container (max-width: 419px) { .kimi-host-safe-header { min-block-size: 0; padding-block-start: var(--daimon-widget-host-safe-block-start, 44px); padding-inline-end: 0; } }
  [data-kimi-root] { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; overflow: visible; }
  [data-kimi-root] * { box-sizing: border-box; min-inline-size: 0; }
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { [data-kimi-root] * { scroll-behavior: auto; } }
  html, body { height: 100%; margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--kimi-font-sans); color: var(--kimi-color-text-primary); -webkit-font-smoothing: antialiased; }
  main.kimi-host-safe-context { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 13px; padding: 8px 22px 16px; }
  .kimi-host-safe-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .title { margin: 0; font-size: 14.5px; font-weight: 500; }
  .brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .brand .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { display: inline-flex; flex: 0 0 auto; width: 20px; height: 20px; }
  .logo svg { display: block; width: 100%; height: 100%; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--kimi-color-text-tertiary); }
  .live-dot::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--kimi-color-positive); }
  .live-dot.err::before { background: var(--kimi-color-danger, #E5484D); }
  .hero { display: flex; flex-direction: column; gap: 6px; }
  .hero-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hero output { display: inline-block; font-size: 40px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .hero .name { font-size: 13px; font-weight: 500; color: var(--kimi-color-text-secondary); }
  .hero .reset { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .pxrail { display: grid; gap: 3px; }
  .pxrail > i { display: block; border-radius: 2.5px; background: color-mix(in srgb, var(--kimi-color-text-primary) 9%, transparent); }
  .pxrail > i.fill { background: color-mix(in srgb, var(--kimi-color-text-primary) 46%, transparent); }
  .pxrail > i.fill.warn { background: color-mix(in srgb, var(--kimi-color-warning, #F5A623) 78%, transparent); }
  .pxrail > i.fill.hot { background: color-mix(in srgb, var(--kimi-color-danger, #E5484D) 72%, transparent); }
  .pxrail.hero-rail { grid-template-columns: repeat(40, minmax(0, 1fr)); }
  .pxrail.hero-rail > i { height: 15px; }
  .pxrail.sub-rail { grid-template-columns: repeat(28, minmax(0, 1fr)); }
  .pxrail.sub-rail > i { height: 9px; }
  .row { display: flex; flex-direction: column; gap: 5px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row-head .label { font-size: 12.5px; color: var(--kimi-color-text-secondary); }
  .row-head .val { font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .row-head .val.hot { color: var(--kimi-color-danger, #E5484D); }
  .row-sub { font-size: 11px; color: var(--kimi-color-text-tertiary); }
  .divider { height: 1px; background: var(--kimi-color-border); }
  .group-label { margin: 0; font-size: 11px; font-weight: 500; color: var(--kimi-color-text-tertiary); }
  #scopedWrap { display: flex; flex-direction: column; gap: 8px; }
  [data-kimi-priority="p3"] { display: none; }
  html[data-daimon-size-tier="expanded"] [data-kimi-priority="p3"] { display: block; }
  .asof { margin: 0; font-family: var(--kimi-font-mono); font-size: 10.5px; color: var(--kimi-color-text-quaternary); }
  html[data-daimon-size-tier="compact"] main.kimi-host-safe-context { padding: 12px 16px; gap: 8px; }
  html[data-daimon-size-tier="compact"] .hero output { font-size: 30px; }
  html[data-daimon-size-tier="compact"] .pxrail.hero-rail > i { height: 12px; }
  html[data-daimon-size-tier="expanded"] .hero output { font-size: 48px; }
  @media (max-width: 299px) { .hero output { font-size: 26px; } }
</style>
</head>
<body>
<main class="kimi-host-safe-context" data-kimi-root>
  <header class="kimi-host-safe-header" data-kimi-priority="p1">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#D97757"/><g stroke="#fff" stroke-width="2.2" stroke-linecap="round"><line x1="7.2" y1="12" x2="16.8" y2="12"/><line x1="12" y1="7.2" x2="12" y2="16.8"/><line x1="8.6" y1="8.6" x2="15.4" y2="15.4"/><line x1="8.6" y1="15.4" x2="15.4" y2="8.6"/></g></svg></span>
      <h1 class="title">Claude usage</h1>
    </div>
    <span class="live-dot" id="liveDot">--</span>
  </header>
  <div class="hero" data-kimi-priority="p0" role="group" aria-label="Five hour session usage">
    <div class="hero-line">
      <output id="fivePct" aria-label="5-hour usage">--%</output>
      <span class="name">5-hour session</span>
      <span class="reset" id="fiveReset"></span>
    </div>
    <div class="pxrail hero-rail" id="fiveRail" aria-hidden="true"></div>
  </div>
  <div class="row" data-kimi-priority="p1">
    <div class="row-head">
      <span class="label">7-day usage</span>
      <span class="val" id="sevenPct">--%</span>
    </div>
    <div class="pxrail sub-rail" id="sevenRail" aria-hidden="true"></div>
    <span class="row-sub" id="sevenReset"></span>
  </div>
  <div data-kimi-priority="p2" style="display:flex;flex-direction:column;gap:8px;" id="scopedSection">
    <div class="divider"></div>
    <p class="group-label">Model limits · weekly</p>
    <div id="scopedWrap"></div>
  </div>
  <p class="asof" data-kimi-priority="p3" id="asof">Waiting for first refresh…</p>
</main>
<script>
(function () {
  'use strict';
  if (window.__claudeBoot) return;
  window.__claudeBoot = true;
  var $ = function (id) { return document.getElementById(id); };
  function buildRail(el, cells) {
    if (el.childElementCount === cells) return;
    while (el.firstChild) el.removeChild(el.firstChild);
    for (var i = 0; i < cells; i++) el.appendChild(document.createElement('i'));
  }
  function paintRail(el, cells, pct) {
    buildRail(el, cells);
    var filled = Math.round(cells * Math.max(0, Math.min(100, pct)) / 100);
    var cls = pct >= 90 ? 'fill hot' : pct >= 70 ? 'fill warn' : 'fill';
    for (var i = 0; i < cells; i++) el.children[i].className = i < filled ? cls : '';
  }
  function fmtPct(p) { return (Math.round(Number(p || 0) * 100) / 100) + '%'; }
  function renderScoped(scoped) {
    var wrap = $('scopedWrap');
    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
    $('scopedSection').style.display = scoped && scoped.length ? 'flex' : 'none';
    (scoped || []).forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'row';
      var head = document.createElement('div');
      head.className = 'row-head';
      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = s.name;
      var val = document.createElement('span');
      val.className = 'val' + (s.pct >= 90 ? ' hot' : '');
      val.textContent = fmtPct(s.pct);
      head.appendChild(label);
      head.appendChild(val);
      var rail = document.createElement('div');
      rail.className = 'pxrail sub-rail';
      rail.setAttribute('aria-hidden', 'true');
      row.appendChild(head);
      row.appendChild(rail);
      wrap.appendChild(row);
      paintRail(rail, 28, s.pct);
    });
  }
  function render(data) {
    var main = (data && data.main) || null;
    if (!main) return;
    paintRail($('fiveRail'), 40, main.fiveHour.pct);
    $('fivePct').textContent = fmtPct(main.fiveHour.pct);
    $('fiveReset').textContent = main.fiveHour.reset || '';
    paintRail($('sevenRail'), 28, main.sevenDay.pct);
    $('sevenPct').textContent = fmtPct(main.sevenDay.pct);
    $('sevenReset').textContent = main.sevenDay.reset || '';
    renderScoped(main.scoped);
    $('asof').textContent = 'Updated ' + (main.asof || 'unknown');
    lastAsof = main.asof || lastAsof;
    renderStatus(curStatus);
  }
  var lastAsof = null;
  var curStatus = null;
  function fmtRefresh(asof) {
    if (!asof) return '--';
    var m = String(asof).match(/(\d{1,2}:\d{2})(?::\d{2})?/);
    if (m) return m[1];
    var d = new Date(asof);
    if (!isNaN(d.getTime())) return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return String(asof);
  }
  function renderStatus(status) {
    curStatus = status;
    var dot = $('liveDot');
    if (status === 'running') { dot.textContent = 'refreshing'; dot.classList.remove('err'); }
    else if (status === 'stale') { dot.textContent = 'stale'; dot.classList.add('err'); }
    else if (status === 'error' || status === 'degraded') { dot.textContent = 'error'; dot.classList.add('err'); }
    else { dot.textContent = fmtRefresh(lastAsof); dot.classList.remove('err'); }
  }
  if (window.DaimonWidget && typeof window.DaimonWidget.onDataChange === 'function') {
    window.DaimonWidget.onDataChange(render);
    if (typeof window.DaimonWidget.onStatusChange === 'function') {
      window.DaimonWidget.onStatusChange(function () { renderStatus(window.DaimonWidget.status); });
    }
    render(window.DaimonWidget.data);
    renderStatus(window.DaimonWidget.status);
  }
})();
</script>
</body>
</html>
